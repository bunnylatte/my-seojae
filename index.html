<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="담노트">
<meta name="format-detection" content="telephone=no">
<title>담노트 DAM:NOTE</title>
<meta name="theme-color" content="#5a67e8">
<meta name="description" content="담노트 DAM:NOTE · 템플릿으로 담아두는 나만의 메모장">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#efede9; --side:#faf9f7; --ink:#2b2a33; --muted:#8b8894; --line:#e5e2dc;
  --accent:#5a67e8; --accent-soft:#eceefe; --danger:#d9534f;
  --ui:'Noto Sans KR',system-ui,sans-serif; --pen:'Gowun Dodum','Malgun Gothic',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--ui);color:var(--ink);background:var(--desk);font-size:14px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select{font:inherit;color:inherit}
[hidden]{display:none!important}

/* ---------- layout ---------- */
#app{display:grid;grid-template-columns:250px 1fr;height:100vh;height:100dvh}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
.m-only{display:none!important}
#scrim{display:none}
#side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:22px 14px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 20px;font-weight:700;font-size:17px}
.brand .bname{display:flex;flex-direction:column;line-height:1.15}
.brand .bname small{font-size:10.5px;letter-spacing:.14em;color:var(--muted);font-weight:500;margin-top:2px}
.brand .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#7b86f0,#5a67e8);display:grid;place-items:center;color:#fff;font-size:15px}
.sec-label{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.06em;padding:14px 10px 6px}
.fitem{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;cursor:pointer;position:relative;user-select:none}
.fitem:hover{background:#f0eee9}
.fitem.on{background:var(--accent-soft);color:var(--accent);font-weight:500}
.fitem.drop{outline:2px dashed var(--accent);outline-offset:-2px}
.fitem .dot{width:10px;height:10px;border-radius:3px;flex:none}
.fitem .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fitem .ct{font-size:12px;color:var(--muted)}
.fitem .acts{display:none;gap:2px}
.fitem:hover .acts{display:flex}
.fitem:hover .ct{display:none}
.fitem .acts button{width:24px;height:24px;border-radius:6px;font-size:12px;color:var(--muted)}
.fitem .acts button:hover{background:#e4e1db;color:var(--ink)}
.addf{margin-top:4px;color:var(--muted);padding:8px 10px;border-radius:9px;text-align:left;width:100%}
.addf:hover{background:#f0eee9;color:var(--ink)}
.side-foot{margin-top:auto;padding:14px 10px 0;font-size:12px;color:var(--muted);line-height:1.5}
.side-foot .bk{display:flex;flex-direction:column;gap:2px;margin:0 -10px 12px}
.side-foot .bk button{text-align:left;padding:7px 10px;border-radius:8px;color:var(--muted);font-size:12.5px}
.side-foot .bk button:hover{background:#f0eee9;color:var(--ink)}
.side-foot .st{display:flex;align-items:center;gap:6px}
.side-foot .st i{width:7px;height:7px;border-radius:50%;background:#9bd1a8;display:inline-block}
.side-foot .st.local i{background:#f0b75e}

#lib{overflow:auto;padding:28px 36px 60px}
.lib-head{display:flex;align-items:center;gap:14px;margin-bottom:26px;flex-wrap:wrap}
.lib-head h1{font-size:24px;margin:0;font-weight:700;flex:1;min-width:160px}
.search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:0 12px;height:38px;width:240px}
.search input{border:0;outline:0;flex:1;background:transparent}
.btn{height:38px;padding:0 16px;border-radius:10px;background:var(--accent);color:#fff;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:#f7f6f3;filter:none}
.btn.danger{background:var(--danger)}
.linkbtn{color:var(--accent);font-weight:700;text-decoration:underline;padding:0}
.banner{background:#fff8e8;border:1px solid #f1dfb3;color:#7a5b16;border-radius:10px;padding:10px 14px;margin-bottom:20px;font-size:13px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:30px 26px}
.nb{position:relative;cursor:pointer}
.cover{aspect-ratio:3/4;border-radius:4px 12px 12px 4px;background:var(--c);position:relative;overflow:hidden;
  box-shadow:0 1px 2px rgba(0,0,0,.08),0 8px 18px -8px rgba(0,0,0,.28);transition:transform .15s,box-shadow .15s}
.nb:hover .cover{transform:translateY(-3px);box-shadow:0 2px 4px rgba(0,0,0,.08),0 14px 26px -10px rgba(0,0,0,.35)}
.cover::before{content:"";position:absolute;inset:0 auto 0 0;width:14px;background:linear-gradient(90deg,rgba(0,0,0,.18),rgba(0,0,0,.04) 60%,rgba(255,255,255,.12))}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.22),transparent 45%)}
.cover .lbl{position:absolute;left:24px;right:12px;top:22%;background:rgba(255,255,255,.92);border-radius:6px;padding:10px 10px 9px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.cover .lbl .ic{font-size:22px;line-height:1}
.cover .lbl .t{font-family:var(--pen);font-size:13px;margin-top:6px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all}
.nb .meta{padding:10px 2px 0;display:flex;align-items:flex-start;gap:4px}
.nb .meta .txt{flex:1;min-width:0}
.nb .name{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nb .date{font-size:12px;color:var(--muted);margin-top:2px}
.nb .more{width:26px;height:26px;border-radius:7px;color:var(--muted);font-size:16px;line-height:1;flex:none}
.nb .more:hover{background:#e4e1db;color:var(--ink)}
.newcard .cover{background:transparent;border:2px dashed #cfcbc3;box-shadow:none;display:grid;place-items:center;color:var(--muted)}
.newcard .cover::before,.newcard .cover::after{display:none}
.newcard:hover .cover{border-color:var(--accent);color:var(--accent);box-shadow:none}
.newcard .plus{font-size:34px;font-weight:300;text-align:center;line-height:1}
.newcard .plus small{display:block;font-size:13px;margin-top:8px;font-weight:500}
.empty{color:var(--muted);padding:40px 0;text-align:center;grid-column:1/-1}

/* ---------- editor ---------- */
#editor{position:fixed;inset:0;background:var(--desk);display:flex;flex-direction:column;z-index:10}
.ebar{display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--side);border-bottom:1px solid var(--line);flex-wrap:wrap}
.ebar .back{height:34px;padding:0 10px;border-radius:8px;display:flex;align-items:center;gap:4px;color:var(--accent);font-weight:500}
.ebar .back:hover{background:var(--accent-soft)}
.ebar .title{flex:1;min-width:140px;border:0;outline:0;background:transparent;font-size:16px;font-weight:700;padding:6px 8px;border-radius:8px}
.ebar .title:focus{background:#fff}
.ebar select{height:34px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:0 8px}
.ebar .sbtn{height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.ebar .sbtn:hover{background:#f7f6f3}
.ebar .sbtn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.ebar .sbtn.pri:hover{filter:brightness(1.06)}
.ebar .saved{font-size:12px;color:var(--muted);min-width:64px;text-align:right}
.tools{display:flex;align-items:center;gap:2px;padding:6px 16px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap;justify-content:center}
.tools button{min-width:32px;height:30px;padding:0 8px;border-radius:7px;font-size:13px;color:#4a4853}
.tools button:hover{background:#f0eee9}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 6px}
.desk{flex:1;overflow:auto;padding:34px 20px 80px;position:relative}
.paper img.photo{display:block;max-width:100%;height:auto;margin:10px auto;border-radius:6px;cursor:pointer}
.paper img.photo.imgsel{outline:3px solid var(--accent);outline-offset:3px}
.paper img[data-pending]{opacity:.45}
.paper .stk{position:absolute;z-index:2;user-select:none;-webkit-user-select:none;cursor:grab;touch-action:none;line-height:1;transform-origin:50% 50%}
.paper .stk.drag{cursor:grabbing}
.paper .stk.sel{outline:2px dashed var(--accent);outline-offset:5px}
.paper .stk .emo{display:block;text-align:center;line-height:1.05;filter:drop-shadow(0 2px 2px rgba(0,0,0,.18))}
.paper .stk .lab{display:block;text-align:center;color:#fff;font-family:var(--ui);font-weight:700;border-radius:10px;padding:.3em .45em;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.18);border:2px solid #fff;overflow:hidden}
.paper .stk img{display:block;width:100%;height:auto;pointer-events:none}
.paper .stk.pic img{border:5px solid #fff;border-radius:4px;box-shadow:0 3px 12px rgba(0,0,0,.25)}
.paper .stk.pic.cut img{border:0;border-radius:0;box-shadow:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.25))}
.paper .stk .h{position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid var(--accent);z-index:3;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.paper .stk .h.rs{right:-14px;bottom:-14px;cursor:nwse-resize}
.paper .stk .h.rt{left:50%;top:-34px;margin-left:-9px;cursor:alias}
.paper .stk .h.rt::after{content:"";position:absolute;left:6px;top:16px;width:2px;height:12px;background:var(--accent)}
.paper .stk .h.del{right:-14px;top:-14px;background:var(--danger);border-color:var(--danger);color:#fff;font-size:10px;line-height:14px;text-align:center;cursor:pointer;font-family:var(--ui)}
#imgbar{position:fixed;z-index:30;display:flex;align-items:center;gap:2px;background:#2b2a33;color:#fff;border-radius:10px;padding:4px;box-shadow:0 8px 20px -6px rgba(0,0,0,.4)}
#imgbar button{height:30px;padding:0 10px;border-radius:7px;font-size:13px;color:#fff}
#imgbar button:hover{background:rgba(255,255,255,.14)}
#imgbar button.red{color:#ff9a96}
#imgbar .sep{width:1px;height:16px;background:rgba(255,255,255,.25);margin:0 4px}
.menu.stkpanel{width:360px;max-height:70vh;overflow:auto}
.stkpanel .eg{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;padding:0 6px 4px}
.stkpanel .eg button{font-size:22px;height:38px;border-radius:8px}
.stkpanel .eg button:hover{background:#f3f1ed;transform:scale(1.15)}
.stkpanel .lg{display:flex;flex-wrap:wrap;gap:6px;padding:2px 10px 10px}
.stkpanel .lg button{color:#fff;font-weight:700;font-size:12px;padding:5px 10px;border-radius:8px}
.stkpanel .lg button.own{background:#fff;color:var(--ink);border:1px dashed #bbb;font-weight:500}

/* ---------- paper ---------- */
.paper{position:relative;--accent:#5a67e8;width:794px;max-width:100%;min-height:1123px;margin:0 auto;background-color:#fff;padding:56px 64px;
  font-family:var(--pen);font-size:16px;line-height:1.75;color:var(--ink);border-radius:3px;
  box-shadow:0 1px 2px rgba(0,0,0,.06),0 10px 30px -12px rgba(0,0,0,.22);outline:0;word-break:keep-all;overflow-wrap:anywhere}
.paper.lined{background-image:linear-gradient(to bottom,transparent 27px,#e6eaf1 27px,#e6eaf1 28px);background-size:100% 28px;background-position:0 52px}
.paper.grid-p{background-image:linear-gradient(#eef0f4 1px,transparent 1px),linear-gradient(90deg,#eef0f4 1px,transparent 1px);background-size:24px 24px}
.paper.dot{background-image:radial-gradient(circle,#d3d7de 1.1px,transparent 1.5px);background-size:22px 22px}
.paper.export{box-shadow:none;border-radius:0;min-height:0;max-width:none}
.paper h1{font-size:26px;margin:0 0 16px;line-height:1.4}
.paper h2{font-size:18px;margin:26px 0 10px;padding-bottom:4px;border-bottom:2px solid var(--accent);line-height:1.5}
.paper h3{font-size:16px;margin:16px 0 6px}
.paper p{margin:4px 0}
.paper ul,.paper ol{margin:6px 0;padding-left:24px}
.paper blockquote{margin:10px 0;padding:10px 16px;border-left:4px solid var(--accent);background:color-mix(in srgb,var(--accent) 7%,#fff);border-radius:0 8px 8px 0}
.paper hr{border:0;border-top:1.5px dashed #d6d2ca;margin:20px 0}
.paper table{border-collapse:collapse;width:100%;margin:10px 0;background:#fff}
.paper th,.paper td{border:1px solid #dcd8e3;padding:7px 11px;vertical-align:top;text-align:left}
.paper th{background:color-mix(in srgb,var(--accent) 9%,#fff);font-weight:700}
.paper table.meta th{width:24%;white-space:nowrap}
.paper .callout{margin:18px 0;padding:11px 15px;border-radius:10px;background:#fdf6e3;border:1px solid #efe2b8}
.paper .pick{display:inline-flex;gap:6px;flex-wrap:wrap;vertical-align:middle;user-select:none;font-family:var(--ui)}
.paper .pick.ori{flex-direction:column;align-items:flex-start;gap:4px}
.paper .pick .opt{padding:1px 10px;border-radius:999px;border:1px solid #d9d5e0;font-size:12.5px;color:#8b8894;cursor:pointer;background:#fff;line-height:1.7;white-space:nowrap;transition:background .12s}
.paper .pick .opt:hover{border-color:var(--accent);color:var(--accent)}
.paper .pick .opt[data-on="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
.paper .pick .opt.rev[data-on="true"]{background:#d9534f;border-color:#d9534f}
.paper .pick .opt.ok[data-on="true"]{background:#3f9a74;border-color:#3f9a74}
.paper .pick .opt.hold[data-on="true"]{background:#8b8894;border-color:#8b8894}
.paper .pick.stars{gap:4px}
.paper .pick .opt.star{color:#d9d4c6;letter-spacing:1px;font-size:13px}
.paper .pick .opt.star[data-on="true"]{background:#fff6e6;border-color:#e8a25b;color:#e8a25b}
.paper.export .pick .opt.star[data-on="true"]{border:0;background:none;font-size:16px}
.paper table.money tfoot th,.paper table.money tfoot td{background:color-mix(in srgb,var(--accent) 9%,#fff);font-weight:700}
.paper table.mandal{table-layout:fixed;background:#fff}
.paper table.mandal td{height:62px;text-align:center;vertical-align:middle;font-size:12.5px;line-height:1.35;padding:3px;border-color:#dcd8e3}
.paper table.mandal td:nth-child(3n+1){border-left:2px solid #8b8894}
.paper table.mandal td:last-child{border-right:2px solid #8b8894}
.paper table.mandal tr:nth-child(3n+1) td{border-top:2px solid #8b8894}
.paper table.mandal tr:last-child td{border-bottom:2px solid #8b8894}
.paper table.mandal tr:nth-child(n+4):nth-child(-n+6) td:nth-child(n+4):nth-child(-n+6){background:#fdecd6;font-weight:700}
.paper table.mandal tr:nth-child(3n+2) td:nth-child(3n+2){background:#fdecd6;font-weight:700}
.paper table.mandal tr:nth-child(5) td:nth-child(5){background:var(--accent)!important;color:#fff;font-size:14px}
.paper.export .pick .opt:not([data-on="true"]){display:none}
.paper .cnt{display:inline-flex;align-items:center;gap:2px;border:1px solid #d9d5e0;border-radius:999px;padding:1px 3px;font-family:var(--ui);font-size:13px;user-select:none;vertical-align:middle;background:#fff;margin-right:6px}
.paper .cnt .v{min-width:18px;text-align:center;font-weight:700;color:var(--accent)}
.paper .cnt .b{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;cursor:pointer;color:#6b6875;font-weight:700}
.paper .cnt .b:hover{background:var(--accent);color:#fff}
.paper.export .cnt{border:0;padding:0}
.paper.export .cnt .b{display:none}
.paper mark{background:#fff1a8;padding:0 2px}
.paper ul.check{list-style:none;padding-left:4px}
.paper ul.check li{position:relative;padding-left:30px;margin:3px 0}
.paper ul.check li::before{content:"";position:absolute;left:2px;top:.42em;width:16px;height:16px;border:1.8px solid #b9b5c2;border-radius:5px;background:#fff;cursor:pointer}
.paper ul.check li[data-done="true"]{color:#a19eaa;text-decoration:line-through}
.paper ul.check li[data-done="true"]::before{background:var(--accent);border-color:var(--accent)}
.paper ul.check li[data-done="true"]::after{content:"";position:absolute;left:8px;top:calc(.42em + 3px);width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}

/* ---------- popups ---------- */
.menu{position:fixed;z-index:50;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px -8px rgba(0,0,0,.22);padding:6px;min-width:190px}
.menu button.mi{display:flex;width:100%;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;text-align:left}
.menu button.mi:hover{background:#f3f1ed}
.menu button.mi.red{color:var(--danger)}
.menu .mh{font-size:11px;color:var(--muted);font-weight:700;padding:8px 10px 4px}
.menu .sw{display:flex;gap:6px;padding:4px 10px 8px;flex-wrap:wrap}
.menu .sw button{width:22px;height:22px;border-radius:6px;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.menu .sw button:hover{transform:scale(1.12)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.overlay{position:fixed;inset:0;background:rgba(30,28,36,.35);z-index:40;display:grid;place-items:center;padding:20px}
.dlg{background:#fff;border-radius:16px;padding:24px;width:420px;max-width:100%;box-shadow:0 20px 50px -10px rgba(0,0,0,.35)}
.dlg.wide{width:760px}
.dlg h3{margin:0 0 6px;font-size:18px}
.dlg p{margin:0 0 14px;color:var(--muted);line-height:1.6}
.dlg input[type=text]{width:100%;height:42px;border:1px solid var(--line);border-radius:10px;padding:0 12px;outline:0;margin:6px 0 4px}
.dlg input[type=text]:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.dlg .row{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:12px}
.ttabs{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 6px}
.ttabs button{height:32px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px}
.ttabs button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tbody{max-height:min(60vh,560px);overflow:auto;padding:2px 2px 6px;margin:0 -2px}
.tsec{font-size:12px;font-weight:700;color:var(--muted);margin:18px 0 -4px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;max-height:min(58vh,560px);overflow:auto;padding:4px 2px;margin-top:6px}
.pgrid .banner{grid-column:1/-1;margin:0}
.pcard{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#f7f6f3}
.pcard img{display:block;width:100%;background:#fff}
.pcard.long{grid-column:1/-1;max-width:260px}
.pcard .pbar{display:flex;align-items:center;gap:4px;padding:6px 8px;font-size:12px;color:var(--muted)}
.pcard .pbar span{flex:1}
.pcard .pbar button{padding:4px 9px;border-radius:7px;background:#fff;border:1px solid var(--line);font-size:12px;color:var(--ink)}
.pcard .pbar button:hover{border-color:var(--accent);color:var(--accent)}
.tcard{border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;position:relative;background:#fff;transition:border-color .12s,transform .12s}
.tcard:hover{border-color:var(--accent);transform:translateY(-2px)}
.tcard .sw{height:70px;border-radius:9px;background:var(--c);display:grid;place-items:center;font-size:28px;margin-bottom:10px;position:relative;overflow:hidden}
.tcard .sw::before{content:"";position:absolute;inset:0 auto 0 0;width:9px;background:rgba(0,0,0,.14)}
.tcard b{display:block;font-weight:700}

const BAD = new Set(['SCRIPT', 'STYLE', 'IFRAME', 'OBJECT', 'EMBED', 'LINK', 'META', 'FORM', 'INPUT', 'BUTTON', 'TEXTAREA', 'SELECT', 'SVG', 'MATH', 'NOSCRIPT', 'TITLE', 'BASE']);

function sanitize(html, keepStyle) {
  const doc = new DOMParser().parseFromString(`<div>${html}</div>`, 'text/html');
  const root = doc.body.firstChild;
  root.querySelectorAll('*').forEach(n => {
    if (BAD.has(n.tagName)) { n.remove(); return; }
    if (n.tagName === 'IMG' && !keepStyle) { n.remove(); return; }
    for (const a of [...n.attributes]) {
      const k = a.name.toLowerCase();
      if (!KEEP.has(k) || (!keepStyle && (k === 'style' || k === 'class' || k === 'color' || k === 'contenteditable' || k === 'data-on' || k === 'data-d'))) n.removeAttribute(a.name);
      else if (k === 'contenteditable' && a.value !== 'false') n.removeAttribute(a.name);
      else if (k === 'href' && !/^https?:/i.test(a.value)) n.removeAttribute(a.name);
      else if (k === 'src' && !(n.tagName === 'IMG' && (/^data:image\/(png|jpeg|gif|webp);base64,[\w+/=]+$/.test(a.value)))) n.removeAttribute(a.name);

}

const b64e = u8 => btoa(String.fromCharCode(...u8));

}

  const pad = el('div', { class: 'lpad' });

  };

    pad.append(el('button', { class: k === 'del' || k === 'ok' ? 'fn' : '', text: k === 'del' ? '⌫' : k === 'ok' ? '확인' : k, onclick: () => press(k) }));
